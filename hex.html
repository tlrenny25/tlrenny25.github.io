<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text  Hex Converter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Text  Hexadecimal Converter</h1>
    
    <textarea id="input" placeholder="Enter text or hex string..."></textarea>
    
    <div class="buttons">
      <button onclick="convertTextToHex()">Text → Hex</button>
      <button onclick="convertHexToText()">Hex → Text</button>
    </div>
    
    <div id="output"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
